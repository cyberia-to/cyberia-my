# cyberia.my — fleets & flats console
# Deploy path: /var/www/html/cyberia.my/
#
# On cyberproxy:
#   sudo cp scripts/nginx-cyberia.my.conf /etc/nginx/sites-available/cyberia.my
#   sudo ln -sf /etc/nginx/sites-available/cyberia.my /etc/nginx/sites-enabled/
#   # after DNS A → 167.235.28.94:
#   sudo certbot --nginx -d cyberia.my -d www.cyberia.my
#   sudo nginx -t && sudo systemctl reload nginx

server {
    server_name cyberia.my www.cyberia.my;

    root /var/www/html/cyberia.my/;
    index index.html;

    location /.well-known {
        root /var/www/html/;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/javascript application/wasm image/svg+xml;
    gzip_proxied any;
    gzip_vary on;
    gzip_comp_level 6;

    # long cache hashed wasm/js/css; HTML no-cache for SPA shell
    location ~* \.(?:wasm|js|css|svg|png|jpg|ico)$ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    listen 80;
    listen [::]:80;
}
