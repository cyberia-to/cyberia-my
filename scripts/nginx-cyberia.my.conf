# cyberia.my — fleets & flats console
# Deploy path: /var/www/html/cyberia.my/
# No www — apex only.
#
# On cyberproxy (after DNS A → 167.235.28.94):
#   sudo cp scripts/nginx-cyberia.my.conf /etc/nginx/sites-available/cyberia.my
#   sudo ln -sf /etc/nginx/sites-available/cyberia.my /etc/nginx/sites-enabled/
#   sudo certbot --nginx -d cyberia.my
#   sudo nginx -t && sudo systemctl reload nginx
#
# Live TLS is managed by certbot (see /etc/nginx/sites-enabled/cyberia.my).

server {
    server_name cyberia.my;

    root /var/www/html/cyberia.my/;
    index index.html;

    location /.well-known {
        root /var/www/html/;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/javascript application/wasm image/svg+xml;
    gzip_proxied any;
    gzip_vary on;
    gzip_comp_level 6;

    location ~* \.(?:wasm|js|css|svg|png|jpg|ico)$ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    listen [::]:443 ssl;
    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/cyberia.my/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cyberia.my/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    if ($host = cyberia.my) {
        return 301 https://$host$request_uri;
    }
    listen 80;
    listen [::]:80;
    server_name cyberia.my;
    return 404;
}
