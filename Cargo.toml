[package]
name = "cyberia"
version = "0.1.0"
edition = "2021"
description = "Cyberia fleets & flats console — Gesing land + workers (cyberia.my)"

[dependencies]
leptos = { version = "0.8", features = ["csr"] }
leptos_router = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
console_error_panic_hook = "0.1"
wasm-bindgen = "0.2"
js-sys = "0.3"

# the real stack, not a simulation: particles are hemera (Poseidon2) hashes,
# the neuron is a mudra domain-scoped key (same identity pipeline as the
# lytics tracker), signals carry ADR-036 signatures. `default-features =
# false` on mudra drops the bip32/bip39 bridge — wasm stays lean.
hemera = { package = "cyber-hemera", path = "../hemera/rs" }
mudra = { package = "cyber-mudra", path = "../mudra", default-features = false }
getrandom = { version = "0.2", features = ["js"] }
web-sys = { version = "0.3", features = [
    "Window",
    "Document",
    "HtmlInputElement",
    "HtmlDivElement",
    "EventTarget",
    "Location",
    "Element",
    "NodeList",
    "MouseEvent",
    "WheelEvent",
    "PointerEvent",
    "SvgElement",
    "CssStyleDeclaration",
    "HtmlElement",
    "Storage",
    "History",
    "PopStateEvent",
    "DomRect",
] }

[[bin]]
name = "cyberia"
path = "src/main.rs"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
